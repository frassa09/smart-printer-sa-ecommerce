version: '3.8'

services:
  backend:
    build:
      context: ./backend
    container_name: smart_printer_backend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - DATABASE_URL=${DATABASE_URL}
      - JWT_SECRET=${JWT_SECRET}

  frontend:
    build:
      context: ./frontend
      args:
        - VITE_API_URL=http://localhost:3000
    container_name: smart_printer_frontend
    restart: unless-stopped
    ports:
      - "8080:80" # Mapeia a porta 80 do Nginx para a 8080 da máquina do colega
    depends_on:
      - backend